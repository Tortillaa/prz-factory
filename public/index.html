<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prz-factory</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #fff; --text: #1c1c1a; --muted: #6b6b66; --line: #d8d8d4;
    --accent: #b45309; --on-accent: #fff; --ask: #fbf1dc; --err: #c93c3c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #222220; --text: #e8e8e4; --muted: #a0a09a; --line: #363633; --accent: #f0a43a; --on-accent: #1c1c1a; --ask: #2c2618; --err: #ff7b7b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  header .hint { margin-left: auto; }
  .hint, .meta, .status { color: var(--muted); font-size: 12px; }
  .status, .num { font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; padding: 24px; max-width: 1440px; margin: 0 auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } header { flex-wrap: wrap; } header .hint { margin-left: 0; } }
  section { margin-bottom: 32px; }
  h2 { font-size: 14px; font-weight: 500; margin: 0 0 12px; display: flex; gap: 8px; align-items: baseline; }
  h2 .count { color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 400; }
  .empty { color: var(--muted); margin: 0; }
  .stack { display: grid; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; cursor: pointer; transition: border-color .15s; overflow-wrap: anywhere; }
  .item:hover { border-color: var(--muted); }
  .item .id { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
  .item.ask { background: var(--ask); border-color: var(--accent); }
  .item .why { margin: 4px 0 0; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .flight { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: center; }
  @media (max-width: 640px) { .flight { grid-template-columns: minmax(0, 1fr); } }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .rail { display: grid; grid-template-columns: repeat(4, 1fr); font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .rail > span { border-top: 2px solid var(--line); padding-top: 8px; position: relative; }
  .rail > .past { border-color: var(--muted); }
  .rail > .now { border-color: var(--text); color: var(--text); }
  .rail > .now::before { content: ""; position: absolute; top: -6px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
  .lenses { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .lens { display: flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .lens::before { content: ""; width: 8px; height: 8px; border: 1px solid var(--muted); border-radius: 2px; }
  .lens.pass { color: var(--text); } .lens.pass::before { background: var(--text); border-color: var(--text); }
  .lens.fail { color: var(--err); } .lens.fail::before { background: var(--err); border-color: var(--err); }
  .lens.active { color: var(--text); } .lens.active::before { border-width: 3px; border-color: var(--text); }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; flex: 1; min-width: 0; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; transition: opacity .15s; }
  button:hover { opacity: .88; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .list .item { padding: 8px 12px; }
  details summary { cursor: pointer; font-weight: 500; margin-bottom: 12px; }
  dialog { width: min(720px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); padding: 20px; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h3 { font-weight: 500; margin: 0 0 8px; padding-right: 28px; }
  dialog .body { white-space: pre-wrap; margin: 12px 0; font-family: var(--mono); font-size: 14px; }
  dialog h4 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 16px 0 8px; }
  .comment { border-left: 4px solid var(--line); padding: 4px 12px; margin: 8px 0; white-space: pre-wrap; }
  .close { position: absolute; top: 12px; right: 12px; background: transparent; color: var(--muted); padding: 0 4px; font-size: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>prz-factory</h1><span class="status" id="active">0 en curso · 0 te esperan</span><span class="status" id="status">conectando…</span><span class="hint">Pide cambios al agente de Orca</span></header>
<div class="layout">
  <main>
    <section><h2>Te esperan <span class="count" id="n-waiting"></span></h2><div class="stack" id="waiting"></div></section>
    <section><h2>En marcha <span class="count" id="n-flight"></span></h2><div class="stack" id="flight"></div></section>
    <section><h2>Cola <span class="count" id="n-queue"></span></h2><div class="stack list" id="queue"></div></section>
  </main>
  <aside>
    <section><h2>Hecho recientemente</h2><div class="stack list" id="done"></div></section>
    <section><details><summary>Backlog <span class="count" id="n-backlog"></span></summary><div class="stack list" id="backlog"></div></details></section>
  </aside>
</div>

<dialog id="detail">
  <button class="close" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button>
  <h3 id="v-title"></h3>
  <div class="meta" id="v-meta"></div>
  <section id="v-panel"></section>
  <div class="body" id="v-body"></div>
  <div class="row"><button id="v-approve" hidden>Aprobar y mergear</button></div>
  <h4>Comentarios</h4><div id="v-comments"></div>
  <form class="row" id="v-comment"><input name="text" placeholder="Añadir comentario" required><button>Enviar</button></form>
  <h4>Historial</h4><div id="v-history" class="meta"></div>
</dialog>

<script type="module">
import { groupBoard, lensStates, stationOf, STATIONS, ago, since, workersOf } from '/board-view.mjs';

let state = { columns: [], lenses: [], cards: [] };
let openId = null;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter((k) => k != null && k !== false));
  return n;
};

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  return data;
}

const lensChips = (card) => lensStates(card, state.lenses).map((l) =>
  el('span', { className: 'lens ' + l.state, textContent: l.lens, title: l.worker ? `${l.lens}: ${l.worker}` : `${l.lens}: ${l.state}` }));

// The rail spec · build · review · merge: a dot where the card is, and a box per lens in review.
function rail(card) {
  const at = stationOf(card, state.lenses);
  if (!at) return null;
  const i = STATIONS.indexOf(at.station);
  return el('div', { className: 'rail' },
    ...STATIONS.map((s, j) => el('span', { className: j < i ? 'past' : j === i ? 'now' : '', textContent: s })),
    at.lenses.length > 0 && el('div', { className: 'lenses' }, ...lensChips(card)));
}

const head = (c) => [el('span', { className: 'id', textContent: '#' + c.id }), c.title];
const open = (node, c) => { node.onclick = () => openCard(c.id); return node; };

function approve(c, btn) {
  const sha = c.run.reviewedSha;
  if (!confirm(`¿Has revisado ${c.run.branch} en ${sha.slice(0, 8)}?\n\nEl merge gate ejecutará verify y, si pasa, la mergeará en la rama base.`)) return;
  btn.disabled = true;
  api(`/api/cards/${c.id}/approve`, { sha })
    .then((r) => alert(`${r.status}: ${r.message}`), (err) => alert(err.message))
    .finally(() => { btn.disabled = false; });
}

function waitingItem(c) {
  const last = (c.comments.at(-1)?.text || '').split('\n').filter(Boolean).slice(0, 3).join('\n');
  const canApprove = c.labels.includes('merge-approval') && c.run.branch && c.run.reviewedSha;
  const btn = canApprove && el('button', { textContent: 'Aprobar y mergear' });
  if (btn) btn.onclick = () => approve(c, btn);
  const form = el('form', { className: 'row' }, el('input', { name: 'text', placeholder: 'Contestar', required: true }), el('button', { className: canApprove ? 'ghost' : '', textContent: 'Enviar' }));
  form.onsubmit = (e) => { e.preventDefault(); comment(c.id, form); };
  const item = el('div', { className: 'item ask' }, el('div', {}, ...head(c)), last && el('p', { className: 'why', textContent: last }), el('div', { className: 'row' }, btn, form));
  // Clicks on the controls must not open the card.
  item.onclick = (e) => { if (!e.target.closest('button, input')) openCard(c.id); };
  return item;
}

function flightItem(c) {
  return open(el('div', { className: 'item flight' },
    el('div', {}, el('div', {}, ...head(c)),
      el('div', { className: 'meta' }, el('span', { textContent: '@' + workersOf(c).join(' @') }), el('span', { className: 'num', textContent: ago(since(c)) }))),
    rail(c)), c);
}

const listItem = (c, note) => open(el('div', { className: 'item' }, ...head(c), el('div', { className: 'meta' }, note)), c);
const queueNote = (c) => c.unmet.length > 0 ? 'espera a ' + c.unmet.map((d) => '#' + d).join(' ') : c.column;

function fill(id, cards, make, empty) {
  $(id).replaceChildren(...(cards.length ? cards.map(make) : [el('p', { className: 'empty', textContent: empty })]));
}

function render() {
  const g = groupBoard(state);
  $('active').textContent = `${g.inFlight.length} en curso · ${g.waiting.length} te esperan`;
  document.title = g.waiting.length ? `(${g.waiting.length}) prz-factory` : 'prz-factory';
  // Do not rebuild "Te esperan" while the person is typing a reply there.
  const typing = $('waiting').contains(document.activeElement) && document.activeElement.value;
  if (!typing) fill('waiting', g.waiting, waitingItem, 'Nada espera tu respuesta');
  fill('flight', g.inFlight, flightItem, 'Ningún worker en marcha');
  fill('queue', g.queue, (c) => listItem(c, queueNote(c)), 'La cola está vacía');
  fill('done', g.done, (c) => listItem(c, [c.run.mergedSha?.slice(0, 7), ago(c.history.at(-1)?.at)].filter(Boolean).join(' · ')), 'Todavía nada');
  fill('backlog', g.backlog, (c) => listItem(c, ''), 'Vacío');
  for (const [id, n] of [['n-waiting', g.waiting], ['n-flight', g.inFlight], ['n-queue', g.queue], ['n-backlog', g.backlog]]) $(id).textContent = n.length;
  if (openId && !$('detail').contains(document.activeElement)) fillView();
}

function openCard(id) { openId = id; fillView(); $('detail').showModal(); }

function fillView() {
  const c = state.cards.find((x) => x.id === openId);
  if (!c) return $('detail').close();
  $('v-title').textContent = `#${c.id} ${c.title}`;
  $('v-meta').replaceChildren(el('span', { textContent: c.column }), ...c.labels.map((l) => el('span', { textContent: l })),
    ...c.unmet.map((d) => el('span', { textContent: `espera a #${d}` })),
    ...Object.entries(c.run).map(([k, v]) => el('span', { textContent: `${k}: ${v}` })));
  const at = stationOf(c, state.lenses);
  $('v-panel').replaceChildren(...(at ? [rail(c)] : []));
  $('v-body').textContent = c.body || '(sin descripción)';
  $('v-approve').hidden = !(c.labels.includes('merge-approval') && c.run.branch && c.run.reviewedSha);
  $('v-comments').replaceChildren(...c.comments.map((m) =>
    el('div', { className: 'comment' }, el('div', { className: 'meta', textContent: `[${m.role}] ${new Date(m.at).toLocaleString()}` }), m.text)));
  $('v-history').replaceChildren(...c.history.map((h) =>
    el('div', { textContent: `${new Date(h.at).toLocaleString()} · ${h.from ? h.from + ' → ' : ''}${h.to}${h.by ? ' (' + h.by + ')' : ''}` })));
}

async function comment(id, form) {
  await api(`/api/cards/${id}/comments`, { text: form.text.value }).then(() => form.reset(), (err) => alert(err.message));
}

$('v-approve').onclick = () => approve(state.cards.find((x) => x.id === openId), $('v-approve'));
$('detail').onclose = () => { openId = null; };
$('v-comment').onsubmit = (e) => { e.preventDefault(); comment(openId, e.target); };

async function refresh() { state = await api('/api/board'); render(); }

const events = new EventSource('/api/events');
events.onopen = () => { $('status').textContent = 'en vivo'; refresh(); };
events.onerror = () => { $('status').textContent = 'desconectado, reintentando…'; };
events.addEventListener('change', refresh);
</script>
</body>
</html>
